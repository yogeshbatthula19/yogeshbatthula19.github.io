  <rect x="360" y="58" width="52" height="6" rx="3" fill="#444"/>
  <rect x="360" y="72" width="64" height="10" rx="4" fill="#555"/>

  <!-- Main chart area -->
  <rect x="16" y="110" width="296" height="154" rx="8" fill="#141414"/>
  <rect x="24" y="118" width="80" height="8" rx="4" fill="#444"/>

  <!-- Y-axis labels -->
  <rect x="24" y="136" width="20" height="4" rx="2" fill="#2e2e2e"/>
  <rect x="24" y="156" width="20" height="4" rx="2" fill="#2e2e2e"/>
  <rect x="24" y="176" width="20" height="4" rx="2" fill="#2e2e2e"/>
  <rect x="24" y="196" width="20" height="4" rx="2" fill="#2e2e2e"/>
