  <!-- Grid lines -->
  <line x1="52" y1="138" x2="300" y2="138" stroke="#222" stroke-width="1"/>
  <line x1="52" y1="158" x2="300" y2="158" stroke="#222" stroke-width="1"/>
  <line x1="52" y1="178" x2="300" y2="178" stroke="#222" stroke-width="1"/>
  <line x1="52" y1="198" x2="300" y2="198" stroke="#222" stroke-width="1"/>
  <line x1="52" y1="218" x2="300" y2="218" stroke="#222" stroke-width="1"/>

  <!-- Area chart fill -->
  <polygon points="52,210 90,188 128,194 166,172 204,160 242,148 280,138 300,130 300,220 52,220"
