<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" width="480" height="280">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#181818"/>
    </linearGradient>
    <linearGradient id="chart-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#555" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#222" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="480" height="280" fill="url(#bg3)" rx="12"/>

  <!-- Top header bar -->
  <rect x="0" y="0" width="480" height="38" fill="#141414" rx="12"/>
  <rect x="0" y="26" width="480" height="12" fill="#141414"/>
  <rect x="16" y="13" width="72" height="7" rx="3.5" fill="#3a3a3a"/>
  <rect x="360" y="11" width="100" height="18" rx="5" fill="#2a2a2a"/>
  <rect x="370" y="17" width="80" height="6" rx="3" fill="#555"/>

  <!-- Stat cards row -->
  <rect x="16" y="50" width="100" height="48" rx="8" fill="#1a1a1a"/>
  <rect x="24" y="58" width="44" height="6" rx="3" fill="#444"/>
  <rect x="24" y="72" width="60" height="10" rx="4" fill="#666"/>

  <rect x="128" y="50" width="100" height="48" rx="8" fill="#1a1a1a"/>
