  <circle cx="204" cy="160" r="3.5" fill="#888"/>
  <circle cx="242" cy="148" r="3.5" fill="#888"/>
  <circle cx="280" cy="138" r="3.5" fill="#888"/>
  <circle cx="300" cy="130" r="4.5" fill="#bbb" stroke="#888" stroke-width="1.5"/>

  <!-- Right panel: data table / model results -->
  <rect x="324" y="110" width="140" height="154" rx="8" fill="#141414"/>
  <rect x="332" y="118" width="72" height="8" rx="4" fill="#444"/>
  <!-- Table rows -->
  <rect x="332" y="136" width="124" height="1" fill="#222"/>
