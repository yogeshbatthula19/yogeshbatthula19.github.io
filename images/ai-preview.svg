  <rect x="392" y="175" width="28" height="5" rx="2.5" fill="#555"/>
  <rect x="332" y="188" width="124" height="1" fill="#222"/>
  <rect x="332" y="192" width="64" height="5" rx="2.5" fill="#333"/>
  <rect x="392" y="192" width="36" height="5" rx="2.5" fill="#555"/>
  <rect x="332" y="205" width="124" height="1" fill="#222"/>
  <rect x="332" y="209" width="48" height="5" rx="2.5" fill="#333"/>
  <rect x="392" y="209" width="44" height="5" rx="2.5" fill="#555"/>
  <rect x="332" y="222" width="124" height="1" fill="#222"/>
  <rect x="332" y="226" width="52" height="5" rx="2.5" fill="#333"/>
  <rect x="392" y="226" width="36" height="5" rx="2.5" fill="#555"/>
  <rect x="332" y="239" width="124" height="1" fill="#222"/>
  <rect x="332" y="246" width="80" height="10" rx="4" fill="#333"/>
  <rect x="420" y="248" width="28" height="6" rx="3" fill="#555"/>
